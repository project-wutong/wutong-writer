[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/project-wutong/wutong-writer"

[workspace.dependencies]
wutong-core = { git = "https://github.com/project-wutong/wutong-core", branch = "main" }
wutong-writer-core = { path = "crates/wutong-writer-core" }

[profile.release]
lto = "thin"
